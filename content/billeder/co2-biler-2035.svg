<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Anonym embedsmand med stor næse holder skilt hvor 2035 og 100 procent er streget ud med rødt og erstattet af 90 procent, ved siden af en lille benzinbil der puster røg">
