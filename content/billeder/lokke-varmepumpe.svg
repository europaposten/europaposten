  <path d="M335 280 L325 400 M335 280 L360 398" fill="none" stroke="#111" stroke-width="2.2"/>
  <ellipse cx="335" cy="210" rx="62" ry="66" fill="#fff" stroke="#111" stroke-width="3.4"/>
  <path d="M280 200 C310 160 380 155 395 205" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="312" cy="205" r="4" fill="#111"/>
  <circle cx="360" cy="205" r="4" fill="#111"/>
  <path d="M295 190 C312 180 325 188" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round"/>
