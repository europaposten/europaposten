<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Karikatur: anonym journalist med stor næse holder en kæmpe EU-håndbog">
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- Gulv -->
  <path d="M60 640 C320 655 580 630 900 645 S1150 635 1160 640" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Åben håndbog: venstre fløj = rød accent -->
  <path d="M185 155
           C175 160 168 178 168 195
           L148 505
           C145 535 170 555 205 552
           L455 545
           C485 542 498 520 500 495
           L518 185
           C520 160 500 148 475 150
           Z" fill="#C8102E" stroke="#111111" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- Titel på rød fløj (lodret, håndskrevet-agtig) -->
  <g fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">
    <text transform="translate(225 480) rotate(-90)">Håndbog i EU</text>
  </g>
  <!-- Indre streg på rød fløj -->
  <path d="M210 195 L195 510" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.45"/>

  <!-- Højre opslag -->
  <path d="M518 185
           C522 158 545 150 570 152
           L990 168
           C1025 172 1038 198 1035 225
           L1020 505
           C1016 538 985 555 955 552
           L545 540
           C515 536 505 512 508 488
           Z" fill="#ffffff" stroke="#111111" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- Tekstlinjer -->
  <g fill="none" stroke="#111111" stroke-linecap="round">
    <path d="M590 220 H970" stroke-width="2"/>
    <path d="M590 258 H945" stroke-width="1.6"/>
    <path d="M590 296 H960" stroke-width="1.6"/>
    <path d="M590 334 H920" stroke-width="1.6"/>
    <path d="M590 372 H955" stroke-width="1.6"/>
    <path d="M590 410 H900" stroke-width="1.6"/>
    <path d="M590 448 H940" stroke-width="1.6"/>
  </g>
  <!-- Abstrakt stjerne (ikke EU-logo) -->
  <path d="M900 490 L908 468 L916 490 L894 476 H922 Z" fill="none" stroke="#111111" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Midterfals -->
  <path d="M510 160 C515 340 508 520 505 545" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Journalist – anonym type med stor næse -->
  <!-- Sko -->
  <path d="M575 638 C595 652 625 648 640 638" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <path d="M680 640 C705 655 740 650 755 638" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <!-- Ben -->
  <path d="M615 545 C608 590 600 620 605 638" fill="none" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M700 545 C710 590 720 622 725 640" fill="none" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Bukser -->
  <path d="M590 430
           C585 490 595 540 605 545
           L720 545
           C735 500 740 450 725 430
           Z" fill="#ffffff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Jakke -->
  <path d="M575 300
           C560 350 570 410 585 430
           L740 430
           C760 395 770 340 750 295
           C680 275 620 280 575 300
           Z" fill="#ffffff" stroke="#111111" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- Revers / slips-hint -->
  <path d="M655 290 L645 420" fill="none" stroke="#111111" stroke-width="2.2"/>
  <path d="M655 290 L680 418" fill="none" stroke="#111111" stroke-width="2.2"/>
  <path d="M655 310 L655 365 L645 410 L665 410 L655 365" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
  <!-- Arme -->
  <path d="M585 330 C520 370 470 430 455 490" fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M740 325 C810 365 870 430 890 495" fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Hænder -->
  <path d="M445 485 C460 505 480 498 490 485" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M875 490 C895 510 920 500 930 485" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Notesblok i lomme -->
  <rect x="700" y="355" width="26" height="34" rx="2" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
  <path d="M706 365 H720 M706 374 H718" fill="none" stroke="#111111" stroke-width="1.3"/>

  <!-- Hoved -->
  <ellipse cx="655" cy="235" rx="52" ry="58" fill="#ffffff" stroke="#111111" stroke-width="3.4"/>
  <!-- Hår -->
  <path d="M610 215 C630 175 690 175 705 220" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <path d="M618 230 C635 195 670 190 690 215" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Øjne -->
  <circle cx="635" cy="225" r="4" fill="#111111"/>
  <circle cx="675" cy="225" r="4" fill="#111111"/>
  <!-- Øjenbryn -->
  <path d="M618 210 C632 200 645 208" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M665 208 C678 198 692 210" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <!-- STOR pæreformet næse (karikatur) -->
  <path d="M652 232
           C675 240 695 255 692 278
           C688 298 665 305 648 295
           C635 286 638 265 642 250
           C645 240 648 234 652 232
           Z" fill="#ffffff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Mund (lille, lidt bekymret) -->
  <path d="M638 305 C650 298 668 302 678 312" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Øre -->
  <path d="M602 235 C588 245 590 270 608 278" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
</svg>
