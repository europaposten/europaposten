  <path d="M405 340 C500 360 580 400 620 430" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round"/>
  <text x="190" y="685" font-family="Georgia, serif" font-size="18" fill="#111">Mette Frederiksen</text>
